[package]
name = "efiles-server"
version = "0.1.0"
edition = "2021"
description = "The Epstein Files - Lion Studios: the studio's server as one static binary (axum + SQLite). (c) 2026 Sunny Chase - Lion Studios. Source-available licence, see LICENSE."
publish = false

[[bin]]
name = "efiles-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
ureq = { version = "2", features = ["json"] }
percent-encoding = "2"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
