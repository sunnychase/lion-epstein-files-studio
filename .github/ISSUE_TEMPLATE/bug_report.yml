name: Bug report
description: Something in the desk, the ingest or the server does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One problem per report, please. Remove personal paths, addresses and keys from anything you paste. Do not paste
        page text that names a redacted party.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the open and closed issues for the same problem.
          required: true
        - label: I removed personal paths, addresses and keys from this report.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingest (ingest.py, a source that does not parse)
        - Second pass (merge, extras, geo, money, enrich)
        - Search and page viewer
        - People & things, graph, path finder
        - 3D bubbles
        - Globe & flights
        - Money, timeline, patterns
        - E-mails, photos, public figures, redactions
        - Notebook
        - Rust server
        - Python server
        - Image packs (fetch, compress, backfill)
        - Phone layout
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and any message in the page, the server log or the browser console.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The hash route helps (for example `#graph:Name` or `#search:words`) if it contains nothing private.
      placeholder: |
        1. Open Connections > Globe & flights
        2. Set min shared pages to ...
        3. Press Draw the globe and ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git -C lion-epstein-files-studio rev-parse --short HEAD`"
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Machine and software
      description: Server OS; Rust binary or server.py and the Python version; browser, version and device; which sources are ingested; which EFILES_* settings you changed (not their private values).
      placeholder: Ubuntu 24.04, Rust binary; Firefox 140 on a laptop; the court files and data sets 1-8
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server log or /api/stats
      description: "The smallest useful part of the server's output (or `journalctl --user -u efiles-web`), or of `/api/stats`."
      render: text

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, or what you already tried.
